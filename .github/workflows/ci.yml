name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests, with coverage (fails under 80%, see pyproject.toml)
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  backend-postgres:
    name: Backend on PostgreSQL 16 and Redis 7
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kguard
          POSTGRES_DB: kguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:kguard@localhost:5432/kguard
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Migrations build the schema from empty, and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests against PostgreSQL, detection state in Redis
        env:
          KGUARD_TEST_DATABASE_URL: postgresql+psycopg://postgres:kguard@localhost:5432/kguard
          KGUARD_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test
      - name: Type-check and build
        run: npm run build

  kernel:
    name: Kernel module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)"
      - name: Build (warnings are errors)
        run: make -C kernel
      - name: Coding style (checkpatch --strict)
        run: make -C kernel checkpatch
      - name: Static analysis (sparse, warnings fail)
        run: |
          sudo apt-get install -y sparse
          make -C kernel sparse
      - name: User-space tools
        run: make -C kernel tools
      - name: Lint Python tools, tests and lab scripts (ruff)
        run: pipx run ruff check kernel/tools kernel/tests scripts --config kernel/ruff.toml

  kernel-vm:
    # Boots the runner's own kernel in a VM (virtme-ng, KVM) and runs the
    # module's kselftest-style tests (TAP) and the full kernel suite there
    name: Kernel module in a VM (selftests + suite)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Let the runner user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU, virtme-ng and kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 "linux-headers-$(uname -r)" iproute2 \
            netcat-openbsd curl busybox-static
          sudo pip install --break-system-packages virtme-ng
          sudo chmod 0644 "/boot/vmlinuz-$(uname -r)"
      - name: Selftests (TAP)
        run: sudo env "PATH=$PATH" kernel/tests/selftests/run_in_vm.sh "/boot/vmlinuz-$(uname -r)"
      - name: Kernel suite
        run: sudo env "PATH=$PATH" kernel/tests/run_in_vm.sh "/boot/vmlinuz-$(uname -r)"

  agent:
    name: Agent (eBPF + C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev libcurl4-openssl-dev \
            linux-tools-common "linux-tools-$(uname -r)"
      - name: Build eBPF programs and agent (warnings are errors)
        run: make -C agent
      - name: Lint agent tests (ruff)
        run: pipx run ruff check agent/tests --config kernel/ruff.toml
