# KGuard Production Environment

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - ./logs:/app/logs
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://kguard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/kguard
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/kguard.log
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Lets the non-root container user read /proc/kguard. Load the module with
    # the same group: sudo insmod kernel/kguard.ko reader_gid=1500
    group_add:
      - "${KGUARD_READER_GID:-1500}"
    # Zero-copy event stream. Uncomment once the module is loaded (Docker
    # refuses to start if the device is missing); without it the backend
    # reads /proc/kguard instead.
    # devices:
    #   - /dev/kguard:/dev/kguard
    # To name the process behind each connection, the backend must see the
    # host's processes:
    # pid: host
    restart: unless-stopped
    # JSON log lines on stdout; Docker rotates them
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # The backend migrates the schema on start-up (alembic upgrade head) and
  # deletes old data daily (RETENTION_*_DAYS)
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=kguard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=kguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kguard -d kguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  backend_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: kguard-production