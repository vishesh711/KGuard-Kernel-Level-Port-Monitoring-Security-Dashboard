# KGuard Production Environment

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    # No published port: only the frontend's nginx reaches the API (/api, /ws)
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
      # A named volume: it takes the image's ownership of /app/logs, so the
      # non-root user can write it (a host directory would be root's)
      - backend_logs:/app/logs
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://kguard:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/kguard
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/kguard.log
      # Detection windows and cooldowns survive restarts (S6.2)
      - REDIS_URL=redis://redis:6379/0
      # Agents enroll with this key (kguard-agent enroll --key ...); empty = enrollment off
      - AGENT_ENROLLMENT_KEY=${AGENT_ENROLLMENT_KEY:-}
      # Notifications (S6.7): set any of these to turn a channel on
      - NOTIFY_MIN_SEVERITY=${NOTIFY_MIN_SEVERITY:-HIGH}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_TO=${EMAIL_TO:-[]}
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      # Prometheus scrapes /metrics with this token (S6.8)
      - METRICS_TOKEN=${METRICS_TOKEN:?set METRICS_TOKEN (openssl rand -hex 32)}
      # Signs login tokens; the backend refuses to start without a strong one
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY (openssl rand -hex 32)}
      # First admin, created on first start only (or: python -m app.users create)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # The name users type in the browser; the API refuses other Host headers
      - ALLOWED_HOSTS=["${KGUARD_HOSTNAME:-localhost}", "localhost", "backend"]
      - ALLOWED_ORIGINS=["http://${KGUARD_HOSTNAME:-localhost}", "https://${KGUARD_HOSTNAME:-localhost}"]
      # Client addresses (for rate limits and logs) come from nginx's
      # X-Forwarded-For; safe because nothing else can reach the backend
      - FORWARDED_ALLOW_IPS=*
    # Least privilege: no root, no capabilities, read-only root filesystem
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Kernel access without root or CAP_NET_ADMIN: load the module with
    #   sudo insmod kernel/kguard.ko reader_gid=1500
    # and members of that group may read /proc/kguard and consume events from
    # /dev/kguard, but cannot change the module's settings or block lists
    # (those Netlink commands need CAP_NET_ADMIN, which this container lacks).
    group_add:
      - "${KGUARD_READER_GID:-1500}"
    # Zero-copy event stream. Uncomment once the module is loaded (Docker
    # refuses to start if the device is missing); without it the backend
    # reads /proc/kguard instead. "rw" because the reader writes its own
    # read position into the shared ring header; it has no other effect.
    # devices:
    #   - /dev/kguard:/dev/kguard:rw
    # To name the process behind each connection, the backend must see the
    # host's processes:
    # pid: host
    restart: unless-stopped
    # JSON log lines on stdout; Docker rotates them
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    # The image has its own nginx.conf (frontend/nginx.conf); put TLS in front
    # of it or extend that file to listen on 443
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # The backend migrates the schema on start-up (alembic upgrade head) and
  # deletes old data daily (RETENTION_*_DAYS)
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=kguard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=kguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kguard -d kguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Metrics (S6.8): Prometheus scrapes the backend; Grafana shows the KGuard
  # dashboard at http://localhost:3001 (user admin, GRAFANA_ADMIN_PASSWORD)
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/kguard-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  backend_data:
    driver: local
  backend_logs:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: kguard-production