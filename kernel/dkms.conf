# DKMS: rebuild and install kguard.ko for every kernel the host installs.
# Used by "make -C kernel dkms-install" (which fills in PACKAGE_VERSION).
PACKAGE_NAME="kguard"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="kguard"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make KDIR=/lib/modules/${kernelver}/build clean"
AUTOINSTALL="yes"
