# KGuard Development Environment

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite:///./data/kguard.db
      - LOG_LEVEL=DEBUG
    depends_on:
      - redis
    # Lets the non-root container user read /proc/kguard. Load the module with
    # the same group: sudo insmod kernel/kguard.ko reader_gid=1500
    group_add:
      - "${KGUARD_READER_GID:-1500}"
    # Zero-copy event stream. Uncomment once the module is loaded (Docker
    # refuses to start if the device is missing); without it the backend
    # reads /proc/kguard instead.
    # devices:
    #   - /dev/kguard:/dev/kguard
    # To name the process behind each connection, the backend must see the
    # host's processes:
    # pid: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: kguard-network